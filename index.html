<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e9e1d2" />
  <title>28 de Maio de 2027</title>
  <link rel="stylesheet" href="fonts.css" />
  <style>
    :root{
      --marble:#efe8da;
      --marble-2:#e4dbc8;
      --ink:#2a3b4d;          /* azul egeu escuro */
      --ink-soft:#5c6b78;
      --gold:#b28f4d;
      --gold-soft:#c9a86a;
      --line:rgba(42,59,77,.16);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:"Jost","Playfair Display",serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 800px at 50% -10%, #fbf7ee 0%, transparent 60%),
        radial-gradient(1000px 700px at 50% 120%, #ded2b8 0%, transparent 55%),
        linear-gradient(160deg, var(--marble) 0%, var(--marble-2) 100%);
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
      -webkit-font-smoothing:antialiased;
    }
    /* veios subtis de mármore */
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
      background:
        repeating-linear-gradient(114deg, transparent 0 38px, rgba(255,255,255,.35) 38px 39px, transparent 39px 90px),
        repeating-linear-gradient(72deg, transparent 0 60px, rgba(42,59,77,.03) 60px 61px, transparent 61px 130px);
      mix-blend-mode:soft-light;
    }

    /* ---- Colunas dóricas ---- */
    .column{position:fixed;top:0;bottom:0;width:120px;z-index:1;pointer-events:none}
    .column.left{left:2.5vw}
    .column.right{right:2.5vw}
    .shaft{
      position:absolute;top:120px;bottom:120px;left:14px;right:14px;
      background:
        linear-gradient(90deg,
          rgba(42,59,77,.20) 0%, rgba(255,255,255,.55) 8%,
          rgba(255,255,255,.15) 22%, rgba(42,59,77,.10) 38%,
          rgba(255,255,255,.35) 52%, rgba(42,59,77,.10) 66%,
          rgba(255,255,255,.15) 80%, rgba(42,59,77,.22) 100%),
        repeating-linear-gradient(90deg, rgba(42,59,77,.10) 0 2px, transparent 2px 16px),
        linear-gradient(180deg,#f3ecdd,#e2d7c0);
      border-radius:4px;
    }
    .capital{position:absolute;top:78px;left:2px;right:2px;height:42px}
    .capital::before{content:"";position:absolute;bottom:0;left:8px;right:8px;height:20px;
      background:linear-gradient(180deg,#f2ecdd,#d9ceb6);border-radius:0 0 40% 40%/0 0 100% 100%}
    .capital::after{content:"";position:absolute;top:0;left:0;right:0;height:24px;
      background:linear-gradient(180deg,#f6f0e2,#e0d5be);box-shadow:0 3px 6px rgba(42,59,77,.10)}
    .base{position:absolute;bottom:78px;left:0;right:0;height:44px}
    .base::before{content:"";position:absolute;top:0;left:8px;right:8px;height:22px;
      background:linear-gradient(180deg,#eee7d7,#d5cab2);border-radius:40% 40% 0 0/100% 100% 0 0}
    .base::after{content:"";position:absolute;bottom:0;left:-2px;right:-2px;height:24px;
      background:linear-gradient(180deg,#efe8d8,#d3c8af);box-shadow:0 4px 10px rgba(42,59,77,.12)}

    /* ---- moldura de meandro (grega) ---- */
    .meander{position:fixed;left:0;right:0;height:34px;z-index:3;pointer-events:none;
      background-repeat:repeat-x;background-size:auto 34px;opacity:.85}
    .meander.top{top:26px}
    .meander.bottom{bottom:26px;transform:scaleY(-1)}

    /* ---- conteúdo central ---- */
    .stage{position:relative;z-index:4;text-align:center;padding:24px;max-width:min(94vw,1100px)}

    .eyebrow{
      font-family:"Jost",sans-serif;font-weight:500;letter-spacing:.42em;text-transform:uppercase;
      font-size:clamp(11px,1.5vw,15px);color:var(--gold);margin-bottom:20px;padding-left:.42em;
    }

    .counter-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,26px)}
    .sprig{width:clamp(34px,5vw,64px);height:clamp(130px,20vw,210px);flex:0 0 auto}
    .sprig.right{transform:scaleX(-1)}

    .counter{display:flex;align-items:baseline;justify-content:center;gap:clamp(3px,.9vw,12px)}
    .unit-box{display:flex;flex-direction:column;align-items:center;min-width:clamp(50px,8.5vw,112px)}
    .num{
      font-family:"Playfair Display",serif;font-weight:700;line-height:1;
      font-size:clamp(40px,8vw,96px);color:var(--ink);
      font-variant-numeric:tabular-nums;
      text-shadow:0 2px 0 rgba(255,255,255,.6),0 14px 30px rgba(42,59,77,.16);
    }
    .lbl{
      font-family:"Jost",sans-serif;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
      font-size:clamp(9px,1.3vw,13px);color:var(--ink-soft);margin-top:12px;
    }
    .colon{
      font-family:"Playfair Display",serif;font-weight:700;line-height:1;
      font-size:clamp(30px,5.5vw,70px);color:var(--gold);opacity:.45;
      align-self:baseline;transform:translateY(-.06em);
    }

    .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:34px 0 14px}
    .divider .rule{height:1px;width:min(22vw,140px);background:linear-gradient(90deg,transparent,var(--gold))}
    .divider .rule.r{background:linear-gradient(90deg,var(--gold),transparent)}
    .divider .gem{width:9px;height:9px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 0 4px rgba(178,143,77,.15)}
    .target{
      font-family:"Playfair Display",serif;font-style:italic;font-weight:400;
      font-size:clamp(18px,3.4vw,30px);color:var(--ink);letter-spacing:.02em;
    }
    .foot{
      margin-top:10px;font-family:"Jost",sans-serif;letter-spacing:.34em;text-transform:uppercase;
      font-size:clamp(10px,1.4vw,12px);color:var(--ink-soft);opacity:.7;padding-left:.34em;
    }

    /* ---- assinaturas ---- */
    .signatures{
      display:flex;justify-content:center;flex-wrap:wrap;
      gap:clamp(28px,7vw,90px);margin-top:clamp(38px,6vw,64px);
    }
    .sig{display:flex;flex-direction:column;align-items:center;gap:6px}
    .sig-name{
      font-weight:400;color:var(--ink);line-height:.9;
      font-size:clamp(38px,6vw,64px);
    }
    .sig-line{
      width:clamp(96px,12vw,150px);height:0;
      border-top:1.4px solid var(--gold);opacity:.65;
      border-radius:2px;transform:rotate(-.6deg);
    }
    /* cada herói assina com uma "mão" diferente */
    .sig:nth-child(1) .sig-name{font-family:"Mr Dafoe",cursive;transform:rotate(-5deg)}
    .sig:nth-child(2) .sig-name{font-family:"Sacramento",cursive;transform:rotate(3deg)}
    .sig:nth-child(3) .sig-name{font-family:"Great Vibes",cursive;transform:rotate(-3deg)}

    @media (max-width:820px){
      .column{display:none}
      .meander.top{top:16px}.meander.bottom{bottom:16px}
    }
    @media (max-width:600px){
      .sprig{display:none}
      .colon{display:none}
      .counter{gap:8px}
      .unit-box{min-width:auto;flex:1 1 0}
      .num{font-size:clamp(26px,10vw,44px)}
      .lbl{letter-spacing:.12em;font-size:10px;margin-top:8px}
    }
  </style>
</head>
<body>
  <div class="meander top"></div>
  <div class="meander bottom"></div>

  <aside class="column left"><div class="capital"></div><div class="shaft"></div><div class="base"></div></aside>
  <aside class="column right"><div class="capital"></div><div class="shaft"></div><div class="base"></div></aside>

  <main class="stage">
    <div class="eyebrow">Contagem decrescente</div>

    <div class="counter-wrap">
      <svg class="sprig left" viewBox="0 0 70 220" aria-hidden="true"></svg>
      <div class="counter" id="counter">
        <div class="unit-box"><span class="num" id="u-mo">--</span><span class="lbl">Meses</span></div>
        <span class="colon">:</span>
        <div class="unit-box"><span class="num" id="u-d">--</span><span class="lbl">Dias</span></div>
        <span class="colon">:</span>
        <div class="unit-box"><span class="num" id="u-h">--</span><span class="lbl">Horas</span></div>
        <span class="colon">:</span>
        <div class="unit-box"><span class="num" id="u-m">--</span><span class="lbl">Minutos</span></div>
        <span class="colon">:</span>
        <div class="unit-box"><span class="num" id="u-s">--</span><span class="lbl">Segundos</span></div>
      </div>
      <svg class="sprig right" viewBox="0 0 70 220" aria-hidden="true"></svg>
    </div>

    <div class="divider"><span class="rule"></span><span class="gem"></span><span class="rule r"></span></div>
    <div class="target">28 de Maio de 2027</div>
    <div class="foot">Ad astra</div>

    <div class="signatures">
      <div class="sig"><span class="sig-name">Aquiles</span><span class="sig-line"></span></div>
      <div class="sig"><span class="sig-name">Ajax</span><span class="sig-line"></span></div>
      <div class="sig"><span class="sig-name">Ulisses</span><span class="sig-line"></span></div>
    </div>
  </main>

  <script>
    // ---- Contagem até 28 de Maio de 2027 (meses, dias, horas, min, seg) ----
    (function(){
      var TARGET = new Date(2027, 4, 28, 0, 0, 0);   // Maio = mês 4
      var el = {
        mo: document.getElementById('u-mo'),
        d:  document.getElementById('u-d'),
        h:  document.getElementById('u-h'),
        m:  document.getElementById('u-m'),
        s:  document.getElementById('u-s')
      };
      function pad(n){ return (n < 10 ? '0' : '') + n; }
      function breakdown(){
        var now = new Date();
        if (now >= TARGET) return {mo:0,d:0,h:0,m:0,s:0};
        // meses inteiros
        var mo = (TARGET.getFullYear()-now.getFullYear())*12 + (TARGET.getMonth()-now.getMonth());
        var anchor = new Date(now); anchor.setMonth(anchor.getMonth()+mo);
        if (anchor > TARGET){ mo--; anchor = new Date(now); anchor.setMonth(anchor.getMonth()+mo); }
        var diff = TARGET - anchor;
        var d = Math.floor(diff/86400000); diff -= d*86400000;
        var h = Math.floor(diff/3600000);  diff -= h*3600000;
        var m = Math.floor(diff/60000);    diff -= m*60000;
        var s = Math.floor(diff/1000);
        return {mo:mo, d:d, h:h, m:m, s:s};
      }
      function render(){
        var b = breakdown();
        el.mo.textContent = b.mo;
        el.d.textContent  = pad(b.d);
        el.h.textContent  = pad(b.h);
        el.m.textContent  = pad(b.m);
        el.s.textContent  = pad(b.s);
      }
      render();
      // atualiza no início de cada segundo
      function tick(){ render(); setTimeout(tick, 1000 - (Date.now() % 1000)); }
      setTimeout(tick, 1000 - (Date.now() % 1000));
    })();

    // ---- Ramos de louros a ladear o contador ----
    (function(){
      var NS = 'http://www.w3.org/2000/svg';
      function leaf(svg, x, y, deg, op){
        var e = document.createElementNS(NS,'ellipse');
        e.setAttribute('cx', x); e.setAttribute('cy', y);
        e.setAttribute('rx', 15); e.setAttribute('ry', 5);
        e.setAttribute('transform', 'rotate('+deg+' '+x+' '+y+')');
        e.setAttribute('fill', '#b28f4d'); e.setAttribute('opacity', op);
        svg.appendChild(e);
      }
      function build(svg){
        var stem = document.createElementNS(NS,'path');
        stem.setAttribute('d','M40 214 Q26 118 40 10');
        stem.setAttribute('fill','none'); stem.setAttribute('stroke','#b28f4d');
        stem.setAttribute('stroke-width','2'); stem.setAttribute('opacity','.5');
        svg.appendChild(stem);
        var N = 6;
        for (var i=1;i<=N;i++){
          var t = i/(N+1);
          var y = 214 - t*196;
          var x = 40 + Math.sin(t*Math.PI)*-12;
          var op = (0.4 + 0.4*Math.sin(t*Math.PI)).toFixed(2);
          leaf(svg, x-3, y, -122, op);   // folha para cima-esquerda
          leaf(svg, x+3, y, -58,  op);   // folha para cima-direita
        }
        // folha do topo
        leaf(svg, 40, 12, -90, 0.7);
      }
      build(document.querySelector('.sprig.left'));
      build(document.querySelector('.sprig.right'));
    })();

    // ---- Padrão de meandro grego (SVG data-URI) ----
    (function(){
      var tile =
        '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="34" viewBox="0 0 40 34">'+
        '<path d="M0 31 H40 M6 31 V7 H30 V25 H14 V15 H22 V21" fill="none" stroke="#b28f4d" stroke-width="3"/>'+
        '</svg>';
      var url = "url('data:image/svg+xml;utf8," + encodeURIComponent(tile) + "')";
      document.querySelector('.meander.top').style.backgroundImage = url;
      document.querySelector('.meander.bottom').style.backgroundImage = url;
    })();
  </script>
</body>
</html>
